name: Build BahaTechWorks Pure Rust Windows .exe & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Pure Rust Windows x64 GUI .exe
        run: cargo build --release
      - name: Prepare Release Executable
        shell: pwsh
        run: |
          Copy-Item target/release/BahaTechWorks.exe BahaTechWorks_v7_Win64.exe
          Get-Item BahaTechWorks_v7_Win64.exe | Select-Object Name, Length
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BahaTechWorks_v7_Win64
          path: BahaTechWorks_v7_Win64.exe
      - name: Publish GitHub Release v7.8.0 (.exe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.8.0
          name: BahaTechWorks v7.8.0 (Pure Rust Windows .exe)
          body: |
            ## BahaTechWorks v7.8.0 — Endüstriyel Talaşlı İmalat, CAD/CAM & ERP (%100 Saf Rust)
            - Tek tıkla çalışan bağımsız **Windows 64-bit `.exe`** (Python/Node gerekmez)
            - **Teklif & Maliyet:** PDF/STEP/JPG/PNG/HEIC okuma, 14+ düzenlenebilir özkütle (`g/cm³`) veritabanı, `Stok Payı (mm)`, Torna/Freze ayrımı, gömülü öğrenen fiyat hafızası, uygulama içi doğrudan WhatsApp API & otomatik A4 PDF ekli SMTP e-posta
            - **CNC Takım Yolu & 3D (BahaCAM 2026):** Gerçek OpenCascade B-Rep STEP görüntüleme, Prompt ile 3D revizyon, sıfıra sıfır + X/Y/Z 3D stok kafesi, 8 özgün strateji, 7 kesici profili, 5-eksen otomatik eğim, çoklu operasyon ağacı (Geri Al/Yinele) ve Fanuc/Siemens/Haas/Heidenhain `.nc`
            - **GİB e-Fatura:** Uygulama içi `Faturayı Aç` A4 önizleme, `UBL-TR 1.2 XML`, Logo/Mikro aktarımı ve yerel `BahaTechWorks_Faturalar` arşivi
            - **Esnek Arayüz:** Cam yüzeyli modern tasarım + Excel gibi kaydırılabilir tüm paneller ve tablo sütunları
          files: BahaTechWorks_v7_Win64.exe
