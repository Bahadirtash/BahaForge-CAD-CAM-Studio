[workspace]

[package]
name = "bahatechworks"
version = "7.8.0"
edition = "2021"
authors = ["Bahadır Taş <admin@bahatechsoftware.com>"]
description = "BahaTechWorks — Pure Rust Native Windows (.exe) & macOS Industrial CNC Quotation, 3D OpenCascade CAD, Stock Model, BahaCAM 2026 & GIB e-Fatura Suite"

[[bin]]
name = "BahaTechWorks"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
